<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTO -I Inward Dak - FBR Inland Revenue Service</title>
    
    <!-- Firebase SDKs for Cloud Online Storage -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --primary-dark: #0f172a;
            --primary: #1e3a8a;
            --primary-accent: #2563eb;
            --blue-glow: #3b82f6;
            --bg-color: #f0f4f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --accent-gold: #f59e0b;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 25px;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .dashboard-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Header Layout - Professional Royal Blue Theme */
        header {
            display: grid;
            grid-template-columns: 1.2fr 2fr 1fr;
            align-items: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1d4ed8 100%);
            padding: 22px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.3);
            margin-bottom: 25px;
            color: white;
            border-bottom: 4px solid var(--accent-gold);
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .fbr-text h2 {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.8px;
            line-height: 1.2;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header-center {
            text-align: center;
        }

        .stylish-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffffff 0%, #bfdbfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            display: inline-block;
        }

        .stylish-title::after {
            content: '';
            display: block;
            width: 70%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), transparent);
            margin: 6px auto 0;
            border-radius: 2px;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .sync-status {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .sync-online {
            background-color: #d1fae5;
            color: #065f46;
        }

        .sync-offline {
            background-color: #fef3c7;
            color: #92400e;
        }

        /* Cards & Form Container */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
            margin-bottom: 25px;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card h3 {
            font-size: 19px;
            color: var(--primary);
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--primary-accent);
            border-radius: 2px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 38px 10px 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.2s ease-in-out;
            outline: none;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        .search-box input:focus {
            border-color: var(--primary-accent);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
        }

        /* Grid & Inputs */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 22px;
            margin-bottom: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 12px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .form-group input, .form-group select {
            padding: 11px 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background-color: #f8fafc;
            transition: all 0.2s ease-in-out;
            color: var(--text-main);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-group {
            display: flex;
            gap: 14px;
            margin-top: 10px;
        }

        .btn {
            padding: 11px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .btn:active { transform: translateY(1px); }

        .btn-primary {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .btn-scan {
            background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
            color: white;
            width: 100%;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        .btn-scan:hover { background: linear-gradient(135deg, #115e59 0%, #0f766e 100%); }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }
        .btn-secondary:hover { background-color: #475569; }

        .btn-backup {
            background-color: #059669;
            color: white;
        }
        .btn-backup:hover { background-color: #047857; }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: #fff;
        }

        th, td {
            padding: 15px 18px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #1e3a8a;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }

        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #eff6ff; }

        .badge-inward {
            background-color: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            display: inline-block;
        }

        .btn-sm {
            padding: 7px 14px;
            font-size: 12px;
            border-radius: 8px;
        }

        .btn-view {
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }
        .btn-view:hover { background-color: #0369a1; }

        .btn-edit { background-color: #f59e0b; color: white; border: none; cursor: pointer; }
        .btn-edit:hover { background-color: #d97706; }

        .btn-delete { background-color: #ef4444; color: white; border: none; cursor: pointer; }
        .btn-delete:hover { background-color: #dc2626; }

        .no-records {
            text-align: center;
            padding: 35px;
            color: #94a3b8;
            font-style: italic;
            font-weight: 500;
        }

        @media (max-width: 900px) {
            header {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .header-left, .header-right {
                justify-content: center;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Header -->
    <header>
        <div class="header-left">
            <div class="fbr-text">
                <h2><strong>FBR Inland Revenue Service</strong></h2>
            </div>
        </div>

        <div class="header-center">
            <h1 class="stylish-title">RTO -I Inward Dak</h1>
        </div>

        <div class="header-right">
            <div class="header-badge" id="currentDateDisplay"></div>
            <div id="syncStatusBadge" class="sync-status sync-offline">
                ☁️ Offline / Local Storage
            </div>
        </div>
    </header>

    <!-- Entry Form Card -->
    <div class="card">
        <h3 id="formTitle" style="border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 22px;">Add New Inward Dak Entry</h3>
        
        <form id="dakForm">
            <input type="hidden" id="editDocId" value="-1">

            <div class="form-grid">
                <div class="form-group">
                    <label>Inward No. (Auto Sequence)</label>
                    <input type="text" id="inwardNo" required readonly style="background-color: #e2e8f0; font-weight: 800; text-align: center; color: #1e3a8a;">
                </div>
                <div class="form-group">
                    <label>Dak Ref No.</label>
                    <input type="text" id="dakRefNo" placeholder="e.g. REF/2026/089" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="dakDate" required onchange="generateInwardNo()">
                </div>
                <div class="form-group">
                    <label>Sender Name / Department</label>
                    <input type="text" id="sender" placeholder="e.g. Ministry of Finance" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Subject / Description</label>
                    <input type="text" id="subject" placeholder="Brief subject of document" required>
                </div>
                <div class="form-group">
                    <label>Forward To / Sec Officer</label>
                    <input type="text" id="forwardTo" placeholder="e.g. Director Admin" required>
                </div>
                <div class="form-group">
                    <label>Scan Document</label>
                    <input type="file" id="scanDoc" accept="image/*,application/pdf" style="display: none;">
                    <button type="button" class="btn btn-scan" id="scanBtn">
                        📷 Scan / Upload Doc
                    </button>
                    <small id="fileNameDisplay" style="color: #64748b; margin-top: 6px; font-size: 12px; display: block; text-align: center; font-weight: 600;"></small>
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">Save Entry</button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
            </div>
        </form>
    </div>

    <!-- Registered Entries Table Card -->
    <div class="card">
        <div class="card-header-flex">
            <h3>Registered Inward Entries</h3>
            
            <div class="search-container">
                <div class="search-box">
                    <input type="date" id="dateSearchInput" onchange="filterTable()" title="Filter by Date">
                    <span class="search-icon">📅</span>
                </div>
                
                <div class="search-box" style="min-width: 240px;">
                    <input type="text" id="searchInput" placeholder="Search Inward No, Ref, Sender..." onkeyup="filterTable()">
                    <span class="search-icon">🔍</span>
                </div>

                <button type="button" class="btn btn-secondary btn-sm" onclick="clearSearchFilters()">Reset Filter</button>
                <button type="button" class="btn btn-backup btn-sm" onclick="exportBackupData()">💾 Backup File</button>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Inward No.</th>
                        <th>Dak Ref No.</th>
                        <th>Date</th>
                        <th>Sender Name / Department</th>
                        <th>Subject / Description</th>
                        <th>Forward To / Sec Officer</th>
                        <th>Document</th>
                        <th>Edit</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // 🌐 GOOGLE FIREBASE CONFIGURATION (آن لائن سیو کرنے کے لیے)
    // درج ذیل اعتراضات میں اپنی Firebase Keys پیسٹ کریں:
    // =========================================================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    let isCloudEnabled = false;
    let db = null;

    // Check if user filled in real Firebase credentials
    if (firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.projectId !== "YOUR_PROJECT_ID") {
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isCloudEnabled = true;
            document.getElementById('syncStatusBadge').className = 'sync-status sync-online';
            document.getElementById('syncStatusBadge').innerHTML = '🟢 Connected to Online Cloud';
        } catch (err) {
            console.error("Firebase init failed:", err);
        }
    }

    // Date display
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);
    document.getElementById('dakDate').valueAsDate = new Date();

    let dakRecords = [];
    let attachedFileBase64 = null;

    // Fiscal Year Helper
    function getFiscalYear(dateString) {
        const d = dateString ? new Date(dateString) : new Date();
        const year = d.getFullYear();
        const month = d.getMonth();

        if (month >= 6) { 
            const nextYearShort = String(year + 1).slice(-2);
            return `${year}-${nextYearShort}`;
        } else { 
            const prevYear = year - 1;
            const currentYearShort = String(year).slice(-2);
            return `${prevYear}-${currentYearShort}`;
        }
    }

    // Auto Inward Sequence Generator
    function generateInwardNo() {
        if (document.getElementById('editDocId').value !== "-1") return; 

        const inputDate = document.getElementById('dakDate').value;
        const fy = getFiscalYear(inputDate);
        
        let fyCounters = JSON.parse(localStorage.getItem('fyCounters_v10')) || {};
        let currentCounter = fyCounters[fy] || 1;
        
        const formattedCounter = String(currentCounter).padStart(3, '0');
        document.getElementById('inwardNo').value = formattedCounter;
    }

    // File Scanner Trigger
    document.getElementById('scanBtn').addEventListener('click', function() {
        document.getElementById('scanDoc').click();
    });

    document.getElementById('scanDoc').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('fileNameDisplay').innerText = `Selected: ${file.name}`;
            const reader = new FileReader();
            reader.onload = function(event) {
                attachedFileBase64 = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // Load Data from Online Cloud OR LocalStorage
    async function fetchRecords() {
        if (isCloudEnabled) {
            try {
                const snapshot = await db.collection("dak_entries").get();
                dakRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (err) {
                console.error("Error fetching online data:", err);
            }
        } else {
            dakRecords = JSON.parse(localStorage.getItem('dakRecords_v10')) || [];
        }
        renderTable();
    }

    // Render Table Chronologically (Date then Inward Number)
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (dakRecords.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="no-records">No inward dak entries found.</td></tr>`;
            return;
        }

        // Ascending Sequence Sort
        dakRecords.sort((a, b) => {
            const dateA = new Date(a.date);
            const dateB = new Date(b.date);
            
            if (dateA - dateB !== 0) {
                return dateA - dateB;
            }
            return parseInt(a.inwardNo, 10) - parseInt(b.inwardNo, 10);
        });

        dakRecords.forEach((record, index) => {
            const tr = document.createElement('tr');

            let docCell = '<span style="color: #94a3b8; font-size: 12px; font-weight: 500;">No Document</span>';
            if (record.fileData) {
                docCell = `<a href="${record.fileData}" target="_blank" class="btn btn-sm btn-view">View File</a>`;
            }

            const recordIdentifier = record.id ? `'${record.id}'` : index;

            tr.innerHTML = `
                <td><span class="badge-inward">${record.inwardNo}</span></td>
                <td><strong>${record.dakRefNo}</strong></td>
                <td>${record.date}</td>
                <td>${record.sender}</td>
                <td>${record.subject}</td>
                <td><span style="background: #f1f5f9; color: #334155; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; display: inline-block;">${record.forwardTo}</span></td>
                <td>${docCell}</td>
                <td>
                    <button type="button" class="btn btn-sm btn-edit" onclick="editRecord(${recordIdentifier})">Edit</button>
                </td>
                <td>
                    <button type="button" class="btn btn-sm btn-delete" onclick="deleteRecord(${recordIdentifier})">Remove</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        filterTable();
    }

    // Filter Function
    function filterTable() {
        const textQuery = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedDate = document.getElementById('dateSearchInput').value;
        const rows = document.querySelectorAll('#tableBody tr');

        rows.forEach(row => {
            if (row.querySelector('.no-records')) return;

            const rowText = row.innerText.toLowerCase();
            const dateCellText = row.children[2] ? row.children[2].innerText : '';

            const matchesText = textQuery === '' || rowText.includes(textQuery);
            const matchesDate = selectedDate === '' || dateCellText.includes(selectedDate);

            if (matchesText && matchesDate) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    function clearSearchFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('dateSearchInput').value = '';
        filterTable();
    }

    // Submit Handler (Online Cloud Sync + Offline Local)
    document.getElementById('dakForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const editId = document.getElementById('editDocId').value;
        const inwardNo = document.getElementById('inwardNo').value;
        const dakRefNo = document.getElementById('dakRefNo').value;
        const date = document.getElementById('dakDate').value;
        const sender = document.getElementById('sender').value;
        const subject = document.getElementById('subject').value;
        const forwardTo = document.getElementById('forwardTo').value;

        const recordPayload = {
            inwardNo,
            dakRefNo,
            date,
            sender,
            subject,
            forwardTo,
            fileData: attachedFileBase64
        };

        if (editId === "-1") {
            // New Entry
            const fy = getFiscalYear(date);
            let fyCounters = JSON.parse(localStorage.getItem('fyCounters_v10')) || {};
            let currentCounter = fyCounters[fy] || 1;

            if (isCloudEnabled) {
                await db.collection("dak_entries").add(recordPayload);
            } else {
                dakRecords.push(recordPayload);
                localStorage.setItem('dakRecords_v10', JSON.stringify(dakRecords));
            }

            fyCounters[fy] = currentCounter + 1;
            localStorage.setItem('fyCounters_v10', JSON.stringify(fyCounters));
        } else {
            // Update Existing Entry
            if (isCloudEnabled) {
                await db.collection("dak_entries").doc(editId).update(recordPayload);
            } else {
                const idx = parseInt(editId, 10);
                dakRecords[idx] = recordPayload;
                localStorage.setItem('dakRecords_v10', JSON.stringify(dakRecords));
            }
        }

        resetForm();
        await fetchRecords();
    });

    // Edit Function
    function editRecord(identifier) {
        let record;
        if (isCloudEnabled) {
            record = dakRecords.find(r => r.id === identifier);
            document.getElementById('editDocId').value = identifier;
        } else {
            record = dakRecords[identifier];
            document.getElementById('editDocId').value = identifier;
        }

        if (!record) return;

        document.getElementById('inwardNo').value = record.inwardNo;
        document.getElementById('dakRefNo').value = record.dakRefNo;
        document.getElementById('dakDate').value = record.date;
        document.getElementById('sender').value = record.sender;
        document.getElementById('subject').value = record.subject;
        document.getElementById('forwardTo').value = record.forwardTo;
        
        attachedFileBase64 = record.fileData;
        if (record.fileData) {
            document.getElementById('fileNameDisplay').innerText = 'Attached file preserved';
        } else {
            document.getElementById('fileNameDisplay').innerText = '';
        }

        document.getElementById('formTitle').innerText = `Edit Entry No: ${record.inwardNo}`;
        document.getElementById('submitBtn').innerText = 'Update Entry';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Delete Function
    async function deleteRecord(identifier) {
        if (confirm("Are you sure you want to remove this record?")) {
            if (isCloudEnabled) {
                await db.collection("dak_entries").doc(identifier).delete();
            } else {
                dakRecords.splice(identifier, 1);
                localStorage.setItem('dakRecords_v10', JSON.stringify(dakRecords));
            }
            await fetchRecords();
        }
    }

    // Reset Form
    function resetForm() {
        document.getElementById('dakForm').reset();
        document.getElementById('editDocId').value = "-1";
        document.getElementById('formTitle').innerText = 'Add New Inward Dak Entry';
        document.getElementById('submitBtn').innerText = 'Save Entry';
        document.getElementById('dakDate').valueAsDate = new Date();
        document.getElementById('fileNameDisplay').innerText = '';
        attachedFileBase64 = null;
        generateInwardNo();
    }

    // Export Offline Backup JSON File
    function exportBackupData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dakRecords, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Dak_Register_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // Init App
    generateInwardNo();
    fetchRecords();
</script>

</body>
</html>
